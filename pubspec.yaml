name: ev_range_tracker
description: Offline range and battery estimation app for the TailG F52 e-bike.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  geolocator: ^11.0.0
  flutter_foreground_task: ^9.2.2
  share_plus: ^9.0.0
  dynamic_color: ^1.7.0
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
